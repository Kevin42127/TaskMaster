<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster</title>
    <meta name="description" content="簡潔高效的任務管理工具">
    <meta name="theme-color" content="#3525CD">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TaskMaster">
    <meta name="application-name" content="TaskMaster">
    <meta name="msapplication-TileColor" content="#3525CD">
    <meta name="msapplication-config" content="/browserconfig.xml">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/512.png">
    <link rel="icon" type="image/png" href="/icons/512.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        
        .task-checkbox:checked + .custom-checkbox {
            background-color: #3525cd;
            border-color: #3525cd;
        }
        
        .task-checkbox:checked + .custom-checkbox::after {
            content: '\e5ca';
            font-family: 'Material Symbols Outlined';
            color: white;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .card-shadow {
            box-shadow: 0 4px 10px rgba(53, 37, 205, 0.04);
        }
        
        .card-shadow-hover:hover {
            box-shadow: 0 8px 20px rgba(53, 37, 205, 0.08);
        }
        
        .delete-btn {
            transition: all 0.2s ease;
        }
        
        .delete-btn:hover {
            background-color: #fef2f2;
            color: #dc2626;
        }
        
        /* 響應式設計 */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }
            
            .task-list {
                width: 100%;
                min-width: unset;
            }
            
            .task-detail {
                width: 100%;
                min-width: unset;
            }
            
            .mobile-menu-btn {
                display: block;
            }
            
            .sidebar.hidden {
                display: none;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
            
            .task-card {
                padding: 1rem;
            }
            
            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.875rem;
            }
            
            .modal-content {
                margin: 1rem;
                max-width: calc(100% - 2rem);
            }
        }
        
        /* 手勢支援 */
        @media (pointer: coarse) {
            .btn {
                min-height: 44px;
                min-width: 44px;
            }
            
            .task-card {
                padding: 1rem;
            }
        }
        
        /* 高解析度螢幕 */
        @media (min-width: 1920px) {
            .container {
                max-width: 1400px;
            }
        }
        
        /* 自訂下拉選單樣式 */
        .custom-select {
            position: relative;
            user-select: none;
        }
        
        .custom-select-trigger {
            padding: 8px 12px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        
        .custom-select-trigger:hover {
            border-color: #9ca3af;
            background-color: #f9fafb;
        }
        
        .custom-select-trigger.active {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }
        
        .custom-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: all 0.2s ease;
            margin-top: 4px;
        }
        
        .custom-options.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }
        
        .custom-option {
            padding: 10px 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .custom-option:hover {
            background-color: #f3f4f6;
        }
        
        .custom-option.selected {
            background-color: #eef2ff;
            color: #6366f1;
            font-weight: 500;
        }
        
        .priority-high { color: #dc2626; }
        .priority-medium { color: #f59e0b; }
        .priority-low { color: #3b82f6; }
        
        /* 日期選擇器樣式 */
        .datetime-picker {
            position: relative;
        }
        
        .datetime-input {
            width: 100%;
            padding: 8px 12px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #374151;
        }
        
        .datetime-input:hover {
            border-color: #9ca3af;
            background-color: #f9fafb;
        }
        
        .datetime-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }
        
        .datetime-input::placeholder {
            color: #9ca3af;
        }
        
        /* 自訂日曆樣式 */
        .calendar-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            z-index: 1000;
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
            transition: all 0.3s ease;
            margin-top: 4px;
            max-height: 380px;
            overflow-y: auto;
        }
        
        .calendar-dropdown.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }
        
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .calendar-nav button {
            width: 28px;
            height: 28px;
            border: none;
            background: #f3f4f6;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: #6b7280;
        }
        
        .calendar-nav button:hover {
            background: #e5e7eb;
            color: #374151;
        }
        
        .calendar-title {
            font-size: 15px;
            font-weight: 600;
            color: #111827;
            min-width: 120px;
            text-align: center;
        }
        
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            padding: 6px 16px;
            background: #f9fafb;
        }
        
        .calendar-weekday {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            padding: 6px 2px;
        }
        
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            padding: 6px 16px 12px;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #374151;
            transition: all 0.2s ease;
            position: relative;
        }
        
        .calendar-day:hover {
            background: #f3f4f6;
        }
        
        .calendar-day.other-month {
            color: #d1d5db;
        }
        
        .calendar-day.today {
            background: #6366f1;
            color: white;
            font-weight: 600;
        }
        
        .calendar-day.today:hover {
            background: #4f46e5;
        }
        
        .calendar-day.selected {
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: 600;
        }
        
        .calendar-day.selected:hover {
            background: #bfdbfe;
        }
        
        .calendar-day.selected.today {
            background: #4f46e5;
            color: white;
        }
        
        /* 時間選擇器 */
        .time-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            border-top: 1px solid #e5e7eb;
            background: #f9fafb;
        }
        
        .time-input {
            width: 50px;
            padding: 4px 6px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
            background: white;
            color: #374151;
        }
        
        .time-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }
        
        .time-separator {
            color: #6b7280;
            font-weight: 600;
        }
        
        /* 模態框和日曆的自定義滾動條 */
        .fade-in::-webkit-scrollbar {
            width: 6px;
        }
        
        .fade-in::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 3px;
        }
        
        .fade-in::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        
        .fade-in::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        .calendar-dropdown::-webkit-scrollbar {
            width: 6px;
        }
        
        .calendar-dropdown::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 3px;
        }
        
        .calendar-dropdown::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        
        .calendar-dropdown::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .slide-out-left {
            animation: slideOutLeft 0.3s ease-out forwards;
        }
        
        @keyframes slideOutLeft {
            from { 
                opacity: 1; 
                transform: translateX(0); 
            }
            to { 
                opacity: 0; 
                transform: translateX(-100%); 
            }
        }
        
        .task-checked {
            text-decoration: line-through;
            opacity: 0.5;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 overflow-hidden">
    <!-- 側邊導航欄 -->
    <aside id="sidebar" class="h-screen w-64 fixed left-0 top-0 bg-white shadow-lg flex flex-col p-4 border-r border-gray-200 z-50">
        <div class="mb-8 px-2">
            <h1 class="text-2xl font-bold text-indigo-600">TaskMaster</h1>
            <p class="text-sm text-gray-500">生產力工作空間</p>
        </div>
        
        <button id="newTaskBtn" class="mb-6 flex items-center justify-center gap-2 bg-indigo-600 text-white py-3 rounded-xl font-semibold shadow-md hover:bg-indigo-700 transition-colors">
            <span class="material-symbols-outlined">add</span>
            新增任務
        </button>
        
        <nav class="flex-1 space-y-1">
            <a href="#" class="nav-item flex items-center gap-3 px-4 py-3 bg-indigo-100 text-indigo-700 rounded-xl font-semibold" data-view="inbox">
                <span class="material-symbols-outlined">list_alt</span>
                任務列表
            </a>
            <a href="settings.html" class="nav-item flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 transition-colors rounded-xl">
                <span class="material-symbols-outlined">settings</span>
                設定
            </a>
                    </nav>
        
        <div class="mt-auto border-t border-gray-200 pt-4">
            <div class="px-4 py-3 text-center">
                <span class="text-xs text-gray-500">v1.0.0</span>
            </div>
        </div>
            </aside>

    <!-- 主內容區域 -->
    <main class="ml-64 h-screen flex">
        <!-- 任務列表區 -->
        <section id="taskList" class="w-[420px] h-full border-r border-gray-200 bg-white overflow-y-auto custom-scrollbar p-6">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-xl font-bold">任務列表</h2>
                    <p class="text-sm text-gray-500">管理所有任務</p>
                </div>
                <div class="flex items-center gap-3">
                    <button id="clearAllBtn" class="px-3 py-1.5 bg-red-100 text-red-700 text-sm font-semibold rounded-lg hover:bg-red-200 transition-colors">
                        <span class="material-symbols-outlined text-[16px]">delete_sweep</span>
                        清空所有
                    </button>
                    <span class="bg-indigo-100 text-indigo-700 text-sm font-semibold px-2 py-1 rounded-lg">
                        <span id="taskCount">3</span> 項任務
                    </span>
                </div>
            </div>
            
                        
            <!-- 任務列表 -->
            <div id="tasksContainer" class="space-y-3">
                <!-- 任務項目將由 JavaScript 動態生成 -->
            </div>
        </section>

        <!-- 任務詳情區 -->
        <section id="taskDetail" class="flex-1 h-full bg-white overflow-y-auto custom-scrollbar p-8 hidden">
            <div class="max-w-3xl mx-auto">
                <!-- 詳情內容將由 JavaScript 動態生成 -->
            </div>
        </section>

        <!-- 歡迎畫面 -->
        <section id="welcomeScreen" class="flex-1 h-full bg-gray-50 flex items-center justify-center">
            <div class="text-center">
                <span class="material-symbols-outlined text-6xl text-gray-300 mb-4">task_alt</span>
                <h2 class="text-2xl font-bold text-gray-700 mb-2">歡迎使用 TaskMaster</h2>
                <p class="text-gray-500">選擇一個任務查看詳情，或新增一個新任務開始</p>
            </div>
        </section>
    </main>

    <!-- 通知系統 -->
    <div id="notificationContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <!-- 新增/編輯任務模態框 -->
    <div id="taskModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white rounded-xl p-8 w-full max-w-2xl max-h-[90vh] overflow-y-auto fade-in">
            <h3 id="modalTitle" class="text-xl font-bold mb-4">新增任務</h3>
            <form id="taskForm">
                <input type="hidden" id="editingTaskId" value="">
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">任務標題</label>
                    <input type="text" id="taskTitle" required 
                           class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">描述</label>
                    <textarea id="taskDescription" rows="4" 
                              class="w-full px-4 py-3 text-base border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">優先級</label>
                    <div class="custom-select" id="prioritySelect">
                        <div class="custom-select-trigger" id="priorityTrigger">
                            <span id="priorityValue" class="priority-medium">中</span>
                            <span class="material-symbols-outlined text-[16px]">expand_more</span>
                        </div>
                        <div class="custom-options" id="priorityOptions">
                            <div class="custom-option" data-value="low">
                                <span class="material-symbols-outlined text-[16px] priority-low">flag</span>
                                <span>低優先級</span>
                            </div>
                            <div class="custom-option selected" data-value="medium">
                                <span class="material-symbols-outlined text-[16px] priority-medium">flag</span>
                                <span>中優先級</span>
                            </div>
                            <div class="custom-option" data-value="high">
                                <span class="material-symbols-outlined text-[16px] priority-high">flag</span>
                                <span>高優先級</span>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" id="taskPriority" value="medium">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">截止時間</label>
                    <div class="datetime-picker">
                        <input type="text" id="taskDueDate" 
                               class="datetime-input" placeholder="選擇截止日期" readonly>
                        <div class="calendar-dropdown" id="calendarDropdown">
                            <div class="calendar-header">
                                <div class="calendar-nav">
                                    <button type="button" id="prevMonth">
                                        <span class="material-symbols-outlined">chevron_left</span>
                                    </button>
                                </div>
                                <div class="calendar-title" id="calendarTitle">2024年1月</div>
                                <div class="calendar-nav">
                                    <button type="button" id="nextMonth">
                                        <span class="material-symbols-outlined">chevron_right</span>
                                    </button>
                                </div>
                            </div>
                            <div class="calendar-weekdays">
                                <div class="calendar-weekday">日</div>
                                <div class="calendar-weekday">一</div>
                                <div class="calendar-weekday">二</div>
                                <div class="calendar-weekday">三</div>
                                <div class="calendar-weekday">四</div>
                                <div class="calendar-weekday">五</div>
                                <div class="calendar-weekday">六</div>
                            </div>
                            <div class="calendar-days" id="calendarDays">
                                <!-- 日期將由JavaScript動態生成 -->
                            </div>
                                                    </div>
                    </div>
                </div>
                <div class="flex gap-4 justify-end mt-8">
                    <button type="button" onclick="closeTaskModal()" 
                            class="px-6 py-3 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors text-base">
                        取消
                    </button>
                    <button type="submit" id="submitBtn"
                            class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors text-base">
                        建立任務
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 任務數據
        let tasks = [
            {
                id: 1,
                title: "歡迎使用 TaskMaster",
                description: "這是一個範例任務，您可以編輯或刪除它，開始管理您的任務",
                priority: "medium",
                dueDate: "",
                completed: false,
                subtasks: [
                    { id: 1, text: "點擊編輯按鈕修改此任務", completed: false },
                    { id: 2, text: "嘗試標記此任務為完成", completed: false },
                    { id: 3, text: "新增您的第一個任務", completed: false }
                ]
            },
            {
                id: 2,
                title: "探索 TaskMaster 功能",
                description: "了解如何使用各種功能來提升您的生產力",
                priority: "low",
                dueDate: "",
                completed: false,
                subtasks: []
            },
            {
                id: 3,
                title: "設定您的第一個目標",
                description: "思考一下您想要完成的重要事項，並將它們添加到任務列表中",
                priority: "high",
                dueDate: "",
                completed: false,
                subtasks: []
            }
        ];

        let selectedTaskId = null;

        // 本地儲存管理
        class LocalStorageManager {
            constructor() {
                this.key = 'taskmaster_tasks';
                this.init();
            }
            
            init() {
                // 檢查瀏覽器是否支援 localStorage
                if (typeof(Storage) === 'undefined') {
                    console.log('瀏覽器不支援 localStorage');
                }
            }
            
            saveTasks() {
                try {
                    localStorage.setItem(this.key, JSON.stringify(tasks));
                } catch (error) {
                    console.error('儲存失敗:', error);
                }
            }
            
            loadTasks() {
                try {
                    const data = localStorage.getItem(this.key);
                    return data ? JSON.parse(data) : null;
                } catch (error) {
                    console.error('載入失敗:', error);
                    return null;
                }
            }
            
            clearTasks() {
                try {
                    localStorage.removeItem(this.key);
                } catch (error) {
                    console.error('清除失敗:', error);
                }
            }
        }
        
        // 初始化本地儲存管理
        const storageManager = new LocalStorageManager();

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            loadTasksFromStorage();
            renderTaskList();
            registerServiceWorker();
            checkForPWAInstall();
        });
        
        // 從本地儲存載入任務
        function loadTasksFromStorage() {
            const savedTasks = storageManager.loadTasks();
            if (savedTasks && savedTasks.length > 0) {
                tasks = savedTasks;
                showNotification(`已載入 ${savedTasks.length} 個任務`, 'info');
            }
        }
        
        // 註冊 Service Worker
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('Service Worker 註冊成功:', registration);
                        
                        // 檢查更新
                        registration.addEventListener('updatefound', () => {

        // 設置自訂下拉選單
        function setupCustomSelect(selectId, triggerId, optionsId, valueId, inputId) {
            const trigger = document.getElementById(triggerId);
            const options = document.getElementById(optionsId);
            const valueSpan = document.getElementById(valueId);
            const hiddenInput = document.getElementById(inputId);
            const optionElements = options.querySelectorAll('.custom-option');
            
            // 切換下拉選單
            trigger.addEventListener('click', function(e) {
                e.stopPropagation();
                const isActive = trigger.classList.contains('active');
                
                // 關閉所有其他下拉選單
                document.querySelectorAll('.custom-select-trigger.active').forEach(t => {
                    t.classList.remove('active');
                    t.parentElement.querySelector('.custom-options').classList.remove('show');
                });
                
                if (!isActive) {
                    trigger.classList.add('active');
                    options.classList.add('show');
                }
            });
            
            // 選擇選項
            optionElements.forEach(option => {
                option.addEventListener('click', function(e) {
                    e.stopPropagation();
                    
                    const value = this.dataset.value;
                    const text = this.querySelector('span:last-child').textContent;
                    const colorClass = this.querySelector('.material-symbols-outlined').className;
                    
                    // 更新顯示值
                    valueSpan.textContent = text;
                    valueSpan.className = colorClass;
                    
                    // 更新隱藏輸入
                    hiddenInput.value = value;
                    
                    // 更新選中狀態
                    optionElements.forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    
                    // 關閉下拉選單
                    trigger.classList.remove('active');
                    options.classList.remove('show');
                });
            });
            
            // 點擊外部關閉
            document.addEventListener('click', function() {
                trigger.classList.remove('active');
                options.classList.remove('show');
            });
        }

        // 設置日曆選擇器
        function setupCalendarPicker() {
            const dateInput = document.getElementById('taskDueDate');
            const calendarDropdown = document.getElementById('calendarDropdown');
            const calendarTitle = document.getElementById('calendarTitle');
            const calendarDays = document.getElementById('calendarDays');
            const prevMonthBtn = document.getElementById('prevMonth');
            const nextMonthBtn = document.getElementById('nextMonth');
            
            let currentDate = new Date();
            let selectedDate = null;
            
            // 將函數暴露到全局作用域
            window.renderCalendar = renderCalendar;
            window.selectedDate = null;
            
            // 切換日曆顯示
            dateInput.addEventListener('click', function(e) {
                e.stopPropagation();
                const isOpen = calendarDropdown.classList.contains('show');
                
                // 關閉其他下拉選單
                document.querySelectorAll('.custom-select-trigger.active').forEach(t => {
                    t.classList.remove('active');
                    t.parentElement.querySelector('.custom-options').classList.remove('show');
                });
                
                if (!isOpen) {
                    calendarDropdown.classList.add('show');
                    renderCalendar();
                } else {
                    calendarDropdown.classList.remove('show');
                }
            });
            
            // 渲染日曆
            function renderCalendar() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                
                // 更新標題
                calendarTitle.textContent = `${year}年${month + 1}月`;
                
                // 清空日期
                calendarDays.innerHTML = '';
                
                // 獲取月份第一天
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const prevLastDay = new Date(year, month, 0);
                
                const startDate = new Date(firstDay);
                startDate.setDate(startDate.getDate() - firstDay.getDay());
                
                const today = new Date();
                
                // 生成42天（6週）
                for (let i = 0; i < 42; i++) {
                    const date = new Date(startDate);
                    date.setDate(startDate.getDate() + i);
                    
                    const dayBtn = document.createElement('button');
                    dayBtn.type = 'button';
                    dayBtn.className = 'calendar-day';
                    dayBtn.textContent = date.getDate();
                    
                    // 判斷是否為當前月份
                    if (date.getMonth() !== month) {
                        dayBtn.classList.add('other-month');
                    }
                    
                    // 判斷是否為今天
                    if (date.toDateString() === today.toDateString()) {
                        dayBtn.classList.add('today');
                    }
                    
                    // 判斷是否為選中日期
                    if (window.selectedDate && date.toDateString() === window.selectedDate.toDateString()) {
                        dayBtn.classList.add('selected');
                    }
                    
                    // 點擊事件
                    dayBtn.addEventListener('click', function() {
                        window.selectedDate = new Date(date);
                        updateDateTimeDisplay();
                        renderCalendar();
                    });
                    
                    calendarDays.appendChild(dayBtn);
                }
            }
            
            // 更新日期顯示
            function updateDateTimeDisplay() {
                if (window.selectedDate) {
                    const formattedDate = formatDateForDisplay(window.selectedDate);
                    dateInput.value = formattedDate;
                }
            }
            
            // 格式化日期顯示
            function formatDateForDisplay(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                
                return `${year}-${month}-${day}`;
            }
            
            // 月份導航
            prevMonthBtn.addEventListener('click', function() {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });
            
            nextMonthBtn.addEventListener('click', function() {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });
            
                        
            // 點擊外部關閉
            document.addEventListener('click', function(e) {
                if (!calendarDropdown.contains(e.target) && e.target !== dateInput) {
                    calendarDropdown.classList.remove('show');
                }
            });
        }

        // 渲染任務列表
        function renderTaskList() {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';
            
            // 顯示所有任務
            let filteredTasks = tasks;
            
            // 按優先級和完成狀態排序
            filteredTasks.sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                const priorityOrder = { high: 0, medium: 1, low: 2 };
                return priorityOrder[a.priority] - priorityOrder[b.priority];
            });
            
            // 渲染所有任務
            filteredTasks.forEach(task => {
                container.appendChild(createTaskCard(task));
            });
            
            // 如果沒有任務，顯示空狀態
            if (filteredTasks.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'text-center py-12 border-2 border-dashed border-gray-300 rounded-xl';
                emptyState.innerHTML = `
                    <span class="material-symbols-outlined text-4xl text-gray-300 mb-4">list_alt</span>
                    <p class="text-gray-500 font-medium">沒有任務</p>
                    <p class="text-sm text-gray-400 mt-2">點擊上方新增任務開始</p>

            updateTaskCount();

        // 關閉任務模態框
        function closeTaskModal() {
            document.getElementById('taskModal').classList.add('hidden');
            document.getElementById('taskForm').reset();
            document.getElementById('modalTitle').textContent = '新增任務';
            document.getElementById('submitBtn').textContent = '建立任務';
            document.getElementById('editingTaskId').value = '';
            
            // 重置優先級選擇器
            const priorityValue = document.getElementById('priorityValue');
            const priorityInput = document.getElementById('taskPriority');
            const priorityOptions = document.querySelectorAll('#priorityOptions .custom-option');
            
            priorityValue.textContent = '中';
            priorityValue.className = 'priority-medium';
            priorityInput.value = 'medium';
            
            priorityOptions.forEach(option => {
                option.classList.remove('selected');
                if (option.dataset.value === 'medium') {
                    option.classList.add('selected');
                }
            });
            
            // 重置日曆選擇器
            document.getElementById('taskDueDate').value = '';
            
            // 重置日曆到當前月份
            const calendarTitle = document.getElementById('calendarTitle');
            const now = new Date();
            calendarTitle.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月`;
            
            // 清空日曆日期
            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';
            
            // 重置選中日期
            if (window.selectedDate) {
                window.selectedDate = null;
            }
        }

        // 通知系統
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500',
                warning: 'bg-yellow-500'
            };
            
            notification.className = `${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg transform transition-all duration-300 translate-x-full`;
            notification.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined">${type === 'success' ? 'check_circle' : type === 'error' ? 'error' : 'info'}</span>
                    <span>${message}</span>
                </div>
            `;
            
            container.appendChild(notification);
            
            // 動畫進入
            setTimeout(() => {
                notification.classList.remove('translate-x-full');
                notification.classList.add('translate-x-0');
            }, 100);
            
            // 3秒後自動消失
            setTimeout(() => {
                notification.classList.add('translate-x-full');
                setTimeout(() => {
                    container.removeChild(notification);
                }, 300);
            }, 3000);
        }

        // 編輯任務
        function editTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            
            // 設置模態框為編輯模式
            document.getElementById('modalTitle').textContent = '編輯任務';
            document.getElementById('submitBtn').textContent = '更新任務';
            document.getElementById('editingTaskId').value = taskId;
            
            // 填入現有資料
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskDescription').value = task.description || '';
            
            // 設置優先級
            const priorityValue = document.getElementById('priorityValue');
            const priorityInput = document.getElementById('taskPriority');
            const priorityOptions = document.querySelectorAll('#priorityOptions .custom-option');
            
            priorityInput.value = task.priority;
            
            // 更新顯示和選中狀態
            priorityOptions.forEach(option => {
                if (option.dataset.value === task.priority) {
                    const text = option.querySelector('span:last-child').textContent;
                    const colorClass = option.querySelector('.material-symbols-outlined').className;
                    
                    priorityValue.textContent = text;
                    priorityValue.className = colorClass;
                    option.classList.add('selected');
                } else {
                    option.classList.remove('selected');
                }
            });
            
            // 設置日期
            if (task.dueDate) {
                const dueDate = new Date(task.dueDate);
                const dateInput = document.getElementById('taskDueDate');
                
                // 設置輸入框值（只取日期部分）
                const year = dueDate.getFullYear();
                const month = String(dueDate.getMonth() + 1).padStart(2, '0');
                const day = String(dueDate.getDate()).padStart(2, '0');
                dateInput.value = `${year}-${month}-${day}`;
                
                // 設置選中日期
                selectedDate = new Date(dueDate);
                const calendarTitle = document.getElementById('calendarTitle');
                calendarTitle.textContent = `${dueDate.getFullYear()}年${dueDate.getMonth() + 1}月`;
                
                // 重新渲染日曆以顯示選中狀態
                renderCalendar();
            } else {
                document.getElementById('taskDueDate').value = '';
            }
            
            // 開啟模態框
            document.getElementById('taskModal').classList.remove('hidden');
        }

        // 新增/更新任務
        function addNewTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const description = document.getElementById('taskDescription').value.trim();
            const priority = document.getElementById('taskPriority').value;
            const dueDate = document.getElementById('taskDueDate').value;
            const editingId = document.getElementById('editingTaskId').value;
            
            if (!title) {
                showNotification('請輸入任務標題', 'error');
                return;
            }
            
            if (editingId) {
                // 更新現有任務
                const task = tasks.find(t => t.id === parseInt(editingId));
                if (task) {
                    task.title = title;
                    task.description = description;
                    task.priority = priority;
                    task.dueDate = dueDate;
                    task.updatedAt = new Date().toISOString();
                    
                    renderTaskList();
                    storageManager.saveTasks();
                    closeTaskModal();
                    showNotification('任務更新成功', 'success');
                }
            } else {
                // 新增任務
                const newTask = {
                    id: Date.now(),
                    title: title,
                    description: description,
                    priority: priority,
                    dueDate: dueDate,
                    completed: false,
                    subtasks: [],
                    createdAt: new Date().toISOString()
                };
                
                tasks.unshift(newTask);
                renderTaskList();
                storageManager.saveTasks();
                closeTaskModal();
                showNotification('任務新增成功', 'success');
            }
        }

        // 更新任務計數
        function updateTaskCount() {
            const activeCount = tasks.filter(task => !task.completed).length;
            document.getElementById('taskCount').textContent = activeCount;
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const taskDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            
            if (taskDate.getTime() === today.getTime()) {
                return `今天 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
            }
            
            return `${date.getMonth() + 1}/${date.getDate()} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        }

        // 格式化完整日期
        function formatFullDate(dateString) {
            const date = new Date(dateString);
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit' 
            };
            return date.toLocaleDateString('zh-TW', options);
        }

        // 點擊模態框外部關閉
        document.getElementById('taskModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeTaskModal();
            }
        });
    </script>
</body>
