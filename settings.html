<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster</title>
    <meta name="description" content="簡潔高效的任務管理工具">
    <meta name="theme-color" content="#3525CD">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TaskMaster">
    <meta name="application-name" content="TaskMaster">
    <meta name="msapplication-TileColor" content="#3525CD">
    <meta name="msapplication-config" content="/browserconfig.xml">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/512.png">
    <link rel="icon" type="image/png" href="/icons/512.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        
        .card-shadow {
            box-shadow: 0 4px 10px rgba(53, 37, 205, 0.04);
        }
        
        .card-shadow-hover:hover {
            box-shadow: 0 8px 20px rgba(53, 37, 205, 0.08);
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 3px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* 自訂開關樣式 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #e5e7eb;
            transition: 0.3s;
            border-radius: 24px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #6366f1;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 側邊導航欄 -->
    <aside id="sidebar" class="h-screen w-64 fixed left-0 top-0 bg-white shadow-lg flex flex-col p-4 border-r border-gray-200 z-50">
        <div class="mb-8 px-2">
            <h1 class="text-2xl font-bold text-indigo-600">TaskMaster</h1>
            <p class="text-sm text-gray-500">生產力工作空間</p>
        </div>
        
        <nav class="flex-1 space-y-1">
            <a href="index.html" class="nav-item flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 transition-colors rounded-xl">
                <span class="material-symbols-outlined">list_alt</span>
                任務列表
            </a>
            <a href="settings.html" class="nav-item flex items-center gap-3 px-4 py-3 bg-indigo-100 text-indigo-700 rounded-xl font-semibold">
                <span class="material-symbols-outlined">settings</span>
                設定
            </a>
        </nav>
        
        <div class="mt-auto border-t border-gray-200 pt-4">
            <div class="px-4 py-3 text-center">
                <span class="text-xs text-gray-500">v1.0.0</span>
            </div>
        </div>
    </aside>
    
    <!-- 主內容區域 -->
    <main class="ml-64 h-screen overflow-y-auto custom-scrollbar">
        <div class="max-w-4xl mx-auto p-8">
            <div class="mb-8 fade-in">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">資料管理</h2>
                <p class="text-gray-600">管理您的任務數據</p>
            </div>
            
            <div class="space-y-8">
                                
                <!-- 資料管理 -->
                <div class="bg-white rounded-xl p-6 card-shadow fade-in" style="animation-delay: 0.1s">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center gap-2">
                        <span class="material-symbols-outlined text-indigo-600">storage</span>
                        資料管理
                    </h3>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <span class="text-sm font-medium text-gray-700">清空所有任務</span>
                                <p class="text-xs text-gray-500">永久刪除所有任務</p>
                            </div>
                            <button onclick="clearAllTasks()" 
                                    class="px-3 py-1.5 bg-red-100 text-red-700 text-sm font-semibold rounded-lg hover:bg-red-200 transition-colors">
                                <span class="material-symbols-outlined text-[16px]">delete_sweep</span>
                                清空所有
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 關於 -->
                <div class="bg-white rounded-xl p-6 card-shadow fade-in" style="animation-delay: 0.2s">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center gap-2">
                        <span class="material-symbols-outlined text-indigo-600">info</span>
                        關於
                    </h3>
                    <div class="space-y-3 text-sm text-gray-600">
                        <p>TaskMaster v1.0.0</p>
                        <p>一個簡潔高效的任務管理工具</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- 通知系統 -->
    <div id="notificationContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>
    
    <script>
        // 通知系統
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500',
                warning: 'bg-yellow-500'
            };
            
            notification.className = `${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 fade-in`;
            notification.innerHTML = `
                <span class="material-symbols-outlined text-sm">
                    ${type === 'success' ? 'check_circle' : type === 'error' ? 'error' : type === 'warning' ? 'warning' : 'info'}
                </span>
                <span>${message}</span>
            `;
            
            container.appendChild(notification);
            
            // 自動移除通知
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    container.removeChild(notification);
                }, 300);
            }, 3000);
        }
        
        // 本地儲存管理
        class LocalStorageManager {
            constructor() {
                this.key = 'taskmaster_tasks';
                this.isEnabled = true;
                this.init();
            }
            
            init() {
                // 檢查瀏覽器是否支援 localStorage
                if (typeof(Storage) !== 'undefined') {
                    this.isEnabled = true;
                } else {
                    this.isEnabled = false;
                    console.log('瀏覽器不支援 localStorage');
                }
            }
            
            saveTasks(tasks) {
                if (!this.isEnabled) return;
                try {
                    localStorage.setItem(this.key, JSON.stringify(tasks));
                } catch (error) {
                    console.error('儲存失敗:', error);
                }
            }
            
            loadTasks() {
                if (!this.isEnabled) return [];
                try {
                    const data = localStorage.getItem(this.key);
                    return data ? JSON.parse(data) : [];
                } catch (error) {
                    console.error('載入失敗:', error);
                    return [];
                }
            }
            
            clearTasks() {
                if (!this.isEnabled) return;
                try {
                    localStorage.removeItem(this.key);
                } catch (error) {
                    console.error('清除失敗:', error);
                }
            }
        }
        
        // 初始化本地儲存管理
        const storageManager = new LocalStorageManager();
        
        // 清空所有任務
        function clearAllTasks() {
            if (confirm('確定要清空所有任務嗎？此操作無法復原。')) {
                // 清空本地儲存
                storageManager.clearTasks();
                showNotification('已清空所有任務', 'success');
            }
        }
    </script>
</body>
</html>
